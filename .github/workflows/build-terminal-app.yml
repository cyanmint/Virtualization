name: Build Android Terminal App

on:
  push:
    branches: [ main, master ]
    paths:
      - 'android/TerminalApp/**'
      - '.github/workflows/build-terminal-app.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'android/TerminalApp/**'
      - '.github/workflows/build-terminal-app.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Build Terminal App
      run: |
        # This is a placeholder build command
        # The actual build needs to be done with Android's build system (soong/make)
        # which requires the full AOSP environment
        echo "Building VmTerminalApp..."
        echo "Note: This app uses Android.bp and requires AOSP build environment"
        echo "For actual builds, please use 'lunch' and 'm VmTerminalApp'"
        
        # Create a placeholder APK for demonstration
        mkdir -p build/outputs
        echo "Placeholder APK" > build/outputs/VmTerminalApp.apk
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v6
      with:
        name: VmTerminalApp
        path: build/outputs/VmTerminalApp.apk
        retention-days: 30
